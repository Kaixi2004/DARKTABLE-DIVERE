name: Build DiVERE releases

on:
  workflow_dispatch:
    inputs:
      macos_intel:
        description: 'Build macOS Intel x86_64 DMG'
        required: false
        default: false
        type: boolean
      macos_arm64:
        description: 'Build macOS Apple Silicon arm64 DMG'
        required: false
        default: true
        type: boolean
      windows:
        description: 'Build Windows x64 installer'
        required: false
        default: true
        type: boolean
      linux:
        description: 'Build Linux x86_64 AppImage'
        required: false
        default: true
        type: boolean
  push:
    tags:
      - 'v*'
      - 'release-*'

permissions:
  contents: write

concurrency:
  group: divere-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-macos-intel:
    name: macOS Intel x86_64
    if: github.event_name == 'workflow_dispatch' && inputs.macos_intel
    runs-on: macos-15-intel

    steps:
      - name: Check out DiVERE source
        uses: actions/checkout@v7
        with:
          submodules: false
          fetch-depth: 0

      - name: Install Homebrew dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_UPGRADE: '1'
        run: |
          brew update > /dev/null || true
          # Tolerate partial failures (e.g. a formula with no bottle for the
          # runner's macOS/arch). build-macos.sh only hard-requires the core
          # DiVERE features (USE_AI, USE_OPENCL); optional codecs/map support
          # are enabled when present and skipped otherwise, matching the
          # verified Intel build.
          brew bundle --verbose --file "$GITHUB_WORKSPACE/.ci/Brewfile" || true

      - name: Refresh lensfun data
        run: lensfun-update-data || true

      - name: Build DiVERE DMG
        run: |
          chmod +x "$GITHUB_WORKSPACE/packaging/divere/build-macos.sh"
          "$GITHUB_WORKSPACE/packaging/divere/build-macos.sh"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: darktable-DiVERE-macos-x86_64
          path: build/divere-x86_64/out/*.dmg
          if-no-files-found: error
          retention-days: 14

  build-macos-arm64:
    name: macOS Apple Silicon arm64
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.macos_arm64) ||
      github.event_name == 'push'
    runs-on: macos-15

    steps:
      - name: Check out DiVERE source
        uses: actions/checkout@v7
        with:
          submodules: false
          fetch-depth: 0

      - name: Install Homebrew dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_UPGRADE: '1'
        run: |
          brew update > /dev/null || true
          # Tolerate partial failures (e.g. a formula with no bottle for the
          # runner's macOS/arch). build-macos.sh only hard-requires the core
          # DiVERE features (USE_AI, USE_OPENCL); optional codecs/map support
          # are enabled when present and skipped otherwise, matching the
          # verified Intel build.
          brew bundle --verbose --file "$GITHUB_WORKSPACE/.ci/Brewfile" || true

      - name: Refresh lensfun data
        run: lensfun-update-data || true

      - name: Build DiVERE DMG
        run: |
          chmod +x "$GITHUB_WORKSPACE/packaging/divere/build-macos.sh"
          "$GITHUB_WORKSPACE/packaging/divere/build-macos.sh"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: darktable-DiVERE-macos-arm64
          path: build/divere-arm64/out/*.dmg
          if-no-files-found: error
          retention-days: 14

  build-windows:
    name: Windows x64
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.windows) ||
      github.event_name == 'push'
    runs-on: windows-2022

    steps:
      - name: Check out DiVERE source
        uses: actions/checkout@v7
        with:
          submodules: false
          fetch-depth: 0

      - name: Install Inno Setup
        shell: bash
        run: choco install innosetup -y --no-progress

      - name: Set up MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            cmake
            ninja
            gcc
            pkg-config
            make
            tar
            gdb
            dos2unix
            perl
            intltool
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-cc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-gcc-libs
            mingw-w64-ucrt-x86_64-drmingw
            mingw-w64-ucrt-x86_64-pkg-config
            mingw-w64-ucrt-x86_64-libtiff
            mingw-w64-ucrt-x86_64-libjpeg-turbo
            mingw-w64-ucrt-x86_64-libpng
            mingw-w64-ucrt-x86_64-libwebp
            mingw-w64-ucrt-x86_64-librsvg
            mingw-w64-ucrt-x86_64-libxml2
            mingw-w64-ucrt-x86_64-lensfun
            mingw-w64-ucrt-x86_64-lcms2
            mingw-w64-ucrt-x86_64-librttopo
            mingw-w64-ucrt-x86_64-libspatialite
            mingw-w64-ucrt-x86_64-sqlite3
            mingw-w64-ucrt-x86_64-libarchive
            mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-openexr
            mingw-w64-ucrt-x86_64-json-c
            mingw-w64-ucrt-x86_64-pugixml
            mingw-w64-ucrt-x86_64-isl
            mingw-w64-ucrt-x86_64-opencl-headers
            mingw-w64-ucrt-x86_64-graphene
            mingw-w64-ucrt-x86_64-flickcurl
            mingw-w64-ucrt-x86_64-libxslt
            mingw-w64-ucrt-x86_64-p11-kit
            mingw-w64-ucrt-x86_64-libgphoto2
            mingw-w64-ucrt-x86_64-libgomp
            mingw-w64-ucrt-x86_64-graphicsmagick
            mingw-w64-ucrt-x86_64-gtk3
            mingw-w64-ucrt-x86_64-webp-pixbuf-loader
            mingw-w64-ucrt-x86_64-adwaita-icon-theme
            mingw-w64-ucrt-x86_64-hicolor-icon-theme
            mingw-w64-ucrt-x86_64-winpthreads
            mingw-w64-ucrt-x86_64-libheif
            mingw-w64-ucrt-x86_64-libavif
            mingw-w64-ucrt-x86_64-portmidi
            mingw-w64-ucrt-x86_64-dbus
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-bzip2
            mingw-w64-ucrt-x86_64-brotli
            mingw-w64-ucrt-x86_64-openjpeg2
            mingw-w64-ucrt-x86_64-osm-gps-map
            mingw-w64-ucrt-x86_64-expat
            mingw-w64-ucrt-x86_64-libssh
            mingw-w64-ucrt-x86_64-libssh2
            mingw-w64-ucrt-x86_64-llvm
            mingw-w64-ucrt-x86_64-python-jsonschema
            mingw-w64-ucrt-x86_64-zstd
            mingw-w64-ucrt-x86_64-xz
            mingw-w64-ucrt-x86_64-openal
            mingw-w64-ucrt-x86_64-fltk
            mingw-w64-ucrt-x86_64-x264
            mingw-w64-ucrt-x86_64-x265
            mingw-w64-ucrt-x86_64-libde265
            mingw-w64-ucrt-x86_64-libjxl
            mingw-w64-ucrt-x86_64-imath
            mingw-w64-ucrt-x86_64-icu
            mingw-w64-ucrt-x86_64-iso-codes
            mingw-w64-ucrt-x86_64-libsecret
            mingw-w64-ucrt-x86_64-gmic
            mingw-w64-ucrt-x86_64-libyaml
            mingw-w64-ucrt-x86_64-lua54
            mingw-w64-ucrt-x86_64-potrace

      - name: Refresh lensfun data
        shell: msys2 {0}
        run: lensfun-update-data || true

      - name: Build DiVERE Windows installer
        shell: msys2 {0}
        env:
          ISCC_EXE: /c/Program Files (x86)/Inno Setup 6/ISCC.exe
        run: |
          chmod +x "$GITHUB_WORKSPACE/packaging/divere/build-windows.sh"
          "$GITHUB_WORKSPACE/packaging/divere/build-windows.sh"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: darktable-DiVERE-windows-x64
          path: build/divere-windows/installer-work/installer/*.exe
          if-no-files-found: error
          retention-days: 14

  build-linux:
    name: Linux x86_64 AppImage
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.linux) ||
      github.event_name == 'push'
    runs-on: ubuntu-22.04
    env:
      LINUXDEPLOY_OUTPUT_VERSION: 5.6.1-银盐菲林日记
      CC: gcc-12
      CXX: g++-12

    steps:
      - name: Check out DiVERE source
        uses: actions/checkout@v7
        with:
          submodules: false
          fetch-depth: 0

      - name: Install compiler GNU12
        run: |
          sudo apt-get update
          sudo apt-get -y install gcc-12 g++-12

      - name: Install base dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install \
            build-essential \
            desktop-file-utils \
            gettext \
            git \
            gdb \
            intltool \
            libarchive-dev \
            libatk1.0-dev \
            libcairo2-dev \
            libcolord-dev \
            libcolord-gtk-dev \
            libcups2-dev \
            libcurl4-gnutls-dev \
            libimage-exiftool-perl \
            libfuse2 \
            libgdk-pixbuf2.0-dev \
            libglib2.0-dev \
            libgmic-dev \
            libgraphicsmagick1-dev \
            libgtk-3-dev \
            libinih-dev \
            libjson-glib-dev \
            liblcms2-dev \
            liblensfun-dev \
            liblensfun-bin \
            liblensfun-data-v1 \
            liblensfun1 \
            libosmgpsmap-1.0-dev \
            libpango1.0-dev \
            libpng-dev \
            libportmidi-dev \
            libpotrace-dev \
            libpugixml-dev \
            librsvg2-dev \
            libsaxon-java \
            libsdl2-dev \
            libsecret-1-dev \
            libsqlite3-dev \
            libtiff5-dev \
            libwebp-dev \
            libx11-dev \
            libxml2-dev \
            libxml2-utils \
            ninja-build \
            perl \
            po4a \
            python3-jsonschema \
            xsltproc \
            zlib1g-dev \
            appstream

      - name: Add PPA for newer multimedia libs
        run: |
          sudo add-apt-repository -y ppa:savoury1/graphics
          sudo add-apt-repository -y ppa:savoury1/ffmpeg4
          sudo add-apt-repository -y ppa:savoury1/display
          sudo apt-get update

      - name: Install extra dependencies
        run: |
          sudo apt-get -y install \
            aom-tools \
            libaom-dev \
            libavif-dev \
            libgphoto2-dev \
            libde265-dev \
            libimath-dev \
            libjpeg-turbo8-dev \
            libjxl-dev \
            libopenexr-dev \
            libopenh264-dev \
            libopenjp2-7-dev \
            libsharpyuv-dev \
            libx265-dev \
            libwebm-dev \
            x11proto-dev \
            libxfixes-dev

      - name: Build and install fresh libheif with built-in decoders
        run: |
          git clone --branch v1.23.1 --depth 1 https://github.com/strukturag/libheif src-libheif
          cd src-libheif
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_PLUGIN_LOADING=OFF \
            -DWITH_LIBDE265=ON \
            -DWITH_AOM_DECODER=ON \
            -DWITH_AOM_ENCODER=ON \
            -DWITH_OpenH264_DECODER=ON \
            -DWITH_JPEG_DECODER=ON \
            -DWITH_OpenJPEG_DECODER=ON \
            -DWITH_LIBSHARPYUV=ON \
            -DCMAKE_INSTALL_PREFIX=/usr
          ninja -C build
          sudo ninja -C build install
          cd ..

      - name: Build and install a more recent version of exiv2
        run: |
          git clone --branch v0.28.8 --depth 1 https://github.com/Exiv2/exiv2 src-exiv2
          cd src-exiv2
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DEXIV2_ENABLE_NLS=ON \
            -DEXIV2_ENABLE_VIDEO=OFF \
            -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build
          sudo cmake --install build
          cd ..

      - name: Refresh lensfun data
        run: sudo lensfun-update-data

      - name: Build DiVERE AppImage
        run: |
          bash tools/appimage-build-script.sh
          mv -f build/Darktable-*.AppImage build/darktable-DiVERE-5.6.1-银盐菲林日记-x86_64.AppImage

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: darktable-DiVERE-linux-x86_64
          path: build/darktable-DiVERE-5.6.1-银盐菲林日记-x86_64.AppImage
          if-no-files-found: error
          retention-days: 14

  github-release:
    name: Publish tag release
    needs:
      - build-macos-intel
      - build-macos-arm64
      - build-windows
      - build-linux
    if: >-
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/') &&
      (needs.build-macos-intel.result == 'success' || needs.build-macos-intel.result == 'skipped') &&
      needs.build-macos-arm64.result == 'success' &&
      needs.build-windows.result == 'success' &&
      needs.build-linux.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: darktable-DiVERE-*
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**/*
          fail_on_unmatched_files: true
          draft: true
          prerelease: false
